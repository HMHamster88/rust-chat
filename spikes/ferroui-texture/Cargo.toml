[package]
name = "ferroui-texture-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone M3 texture gate: Direct2D + D3D11 shared-frame presentation.
[workspace]

[dependencies]
ferroui-base = "=0.5.0"
ferroui-controls = "=0.5.0"
ferroui-desktop = { version = "=0.5.0", default-features = false, features = ["direct2d"] }
ferroui-themes-fluent = "=0.5.0"
ferroui-media = "=0.5.0"
ferroui-media-controls = "=0.5.0"

[target.'cfg(windows)'.dependencies]
ferroui-direct2d = { version = "=0.5.0", features = ["media-controls"] }
windows = { version = "0.61.3", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
