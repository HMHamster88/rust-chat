[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/crypto",
    "crates/server",
    "crates/client-core",
    "crates/media",
    "crates/media-desktop",
    "crates/media-android",
    "crates/ui",
    "crates/app-desktop",
    "crates/app-android",
    "xtask",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
hmac = "0.13.0"
rcgen = "0.14.10"
rpassword = "7.4.0"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
