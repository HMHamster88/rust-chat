name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows client
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build client
        run: cargo build --release --locked -p rust-chat-desktop

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/rust-chat.exe dist/
          Copy-Item README.md dist/
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          Set-Content dist/SHA256SUMS.txt $lines
          Compress-Archive -Path dist/* -DestinationPath "rust-chat-$($env:GITHUB_REF_NAME)-windows-x64.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: rust-chat-*-windows-x64.zip
          generate_release_notes: true

  linux-server:
    name: Linux server
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build server
        run: cargo build --release --locked -p rust-chat-server

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rust-chat-server dist/
          cp README.md dist/
          cd dist
          sha256sum rust-chat-server > SHA256SUMS.txt
          tar -czf "../rust-chat-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" *

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: rust-chat-*-linux-x86_64.tar.gz
          generate_release_notes: true
