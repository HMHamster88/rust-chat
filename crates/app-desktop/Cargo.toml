[package]
name = "rust-chat-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rust-chat"
path = "src/main.rs"

[lib]
name = "rust_chat_desktop"
path = "src/lib.rs"

[dependencies]
ferroui-base = "=0.5.0"
ferroui-controls = "=0.5.0"
ferroui-desktop = { version = "=0.5.0", default-features = false, features = ["direct2d"] }
ferroui-themes-fluent = "=0.5.0"
ferroui-media = "=0.5.0"
ferroui-media-controls = "=0.5.0"
ferroui-direct2d = { version = "=0.5.0", features = ["media-controls"] }
rust-chat-client-core = { path = "../client-core" }
rust-chat-media = { path = "../media" }
rust-chat-media-desktop = { path = "../media-desktop" }
rust-chat-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54.1", features = ["full"] }
windows = { version = "0.61.3", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
rust-chat-crypto = { path = "../crypto" }
rust-chat-server = { path = "../server" }
