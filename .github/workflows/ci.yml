name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  server:
    name: Server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p rust-chat-protocol -p rust-chat-crypto -p rust-chat-server -p rust-chat-client-core --all-targets -- -D warnings

      - name: Test
        run: cargo test -p rust-chat-protocol -p rust-chat-crypto -p rust-chat-server -p rust-chat-client-core

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the static release binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked -p rust-chat-server --target x86_64-unknown-linux-musl

      - name: Check the static binary has no glibc dependency
        run: |
          bin=target/x86_64-unknown-linux-musl/debug/rust-chat-server
          file "$bin"
          ! ldd "$bin" 2>&1 | grep -q libc.so
          "$bin" --version

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
