[package]
name = "rust-chat-client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
directories = "6.0.0"
futures-util = "0.3.34"
keyring = "4.2.0"
rand = "0.10.4"
rust-chat-crypto = { path = "../crypto" }
rust-chat-protocol = { path = "../protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = "0.30.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
rcgen = { workspace = true }
rust-chat-server = { path = "../server" }
