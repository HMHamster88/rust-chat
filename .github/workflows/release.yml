name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows client
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Find a prebuilt client for this commit
        id: prebuilt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --workflow windows-build.yml --commit "${{ github.sha }}" --status success --limit 1 --json databaseId | ConvertFrom-Json
          if ($runs.Count -gt 0) {
            "run_id=$($runs[0].databaseId)" >> $env:GITHUB_OUTPUT
            Write-Output "Using Windows build run $($runs[0].databaseId)"
          } else {
            Write-Output "No prebuilt artifact; this run will build the client."
          }

      - name: Download the prebuilt client
        if: steps.prebuilt.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: rust-chat-windows-client
          path: prebuilt
          run-id: ${{ steps.prebuilt.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the client (fallback)
        if: steps.prebuilt.outputs.run_id == ''
        run: cargo build --release --locked -p rust-chat-desktop

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = if (Test-Path "prebuilt/rust-chat.exe") { "prebuilt/rust-chat.exe" } else { "target/release/rust-chat.exe" }
          Copy-Item $exe dist/rust-chat.exe
          Copy-Item README.md dist/
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          Set-Content dist/SHA256SUMS.txt $lines
          Compress-Archive -Path dist/* -DestinationPath "rust-chat-$($env:GITHUB_REF_NAME)-windows-x64.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: rust-chat-*-windows-x64.zip
          generate_release_notes: true

  linux-server:
    name: Linux server
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build server
        run: cargo build --release --locked -p rust-chat-server

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rust-chat-server dist/
          cp README.md dist/
          cd dist
          sha256sum rust-chat-server > SHA256SUMS.txt
          tar -czf "../rust-chat-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" *

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: rust-chat-*-linux-x86_64.tar.gz
          generate_release_notes: true
